[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "branchs"
version = "0.1.0"
description = "Multi-branch management tool with GUI and CLI support"
requires-python = ">=3.9"
dependencies = [
    "gitpython>=3.1.40",
    "rich>=13.0.0",
    "click>=8.0.0",
]

[project.scripts]
branchs = "branchs.cli:main"
branchs-gui = "branchs.gui:main"

[project.optional-dependencies]
gui = ["tkinter"]

[tool.setuptools.packages.find]
include = ["branchs*"]
